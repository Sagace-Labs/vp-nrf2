schema = 1
pathway = "nrf2"
version = "v3"
released = "2026-09-24"
supersedes = "v2"
reason = "adds current EPA ARE calls through an assay-token ensemble with guarded probability calibration"

[signature]
version = 1
inputs = ["smiles"]

[[signature.outputs]]
name = "nrf2_are"
dtype = "float32"
range = [0.0, 1.0]
semantics = "P(activates the antioxidant response element reporter in the Tox21 qHTS screen). The reporter registers indirect activators alongside direct electrophiles"
missing = "NaN when RDKit cannot parse the input SMILES"

[[signature.outputs]]
name = "nrf2_cytotox"
dtype = "float32"
range = [0.0, 1.0]
semantics = "P(reduces viability in the counter-screen over the same library). A compound scoring high on both readouts raised the reporter in a cell that was also dying"
missing = "NaN when RDKit cannot parse the input SMILES"

[dataset]
name = "Tox21 antioxidant response element qHTS"
source = "PubChem BioAssay AID 743202 (qHTS assay for small molecule agonists of the antioxidant response element (ARE) signaling pathway) and AID 743203 (qHTS assay for small molecule agonists of the antioxidant response element (ARE) signaling pathway - cell viability counter screen), rows called Active or Inactive, one row per compound labelled by majority call across its assay records"
url = "https://pubchem.ncbi.nlm.nih.gov/rest/pug/assay/aid/743202/concise/CSV"
retrieved = "2026-09-06"
licence = "public-domain"
redistributable = true
path = "data/nrf2_tox21.parquet"
labels = ["label", "cytotox"]
sha256 = "9d966167f286084d260da7664519eec2890dd6da04e4c32fec208a476d9dba35"
n_rows = 4540
base_rate = 0.093172
fetch = "python -m vp_nrf2.data fetch --verify"

[[dataset.auxiliary]]
name = "Tox21 viability counter-screens"
role = "training-only"
source = "PubChem BioAssay AID 743086 (qHTS assay to identify small molecule that activate the aryl hydrocarbon receptor (AhR) signaling pathway - cell viability counter screen), AID 720693 (qHTS assay to identify small molecule antagonists of the glucocorticoid receptor (GR) signaling pathway - cell viability counter screen), AID 743209 (qHTS assay for small molecule activators of the heat shock response signaling pathway - cell viability counter screen), AID 651633 (qHTS assay to identify small molecule agonists of the p53 signaling pathway - cell viability counter screen), AID 1346977 (qHTS assay to identify small molecule agonists of the pregnane X receptor (PXR) signaling pathway - cell viability counter screen), rows called Active or Inactive, one row per compound labelled by majority call across its assay records"
retrieved = "2026-09-06"
licence = "public-domain"
redistributable = true
path = "data/nrf2_viability_pool.parquet"
labels = ["y_ahr_viability", "y_gr_viability", "y_hsr_viability", "y_p53_viability", "y_pxr_viability"]
sha256 = "5ea39f1bc029e1960c9753227b6723066a9412c5984032da4dbfc99412001dd6"
n_rows = 8177
fetch = "python -m vp_nrf2.data fetch --verify"

[[dataset.auxiliary]]
name = "EPA invitrodb v4.3 AEID 1110 ARE activity calls"
role = "training-only"
source = "EPA v4.3 PubChem export of 18 August 2026, Active/Inactive calls paired with archived 2018 EPA chemical identities; unresolved, inconclusive and primary connectivity identities excluded"
retrieved = "2026-09-23"
licence = "public-domain"
redistributable = true
path = "data/nrf2_epa_aeid1110.parquet"
labels = ["label"]
sha256 = "45d90bf14de8934bbd830f7fdacc484eca5d65fbfc1ad864ef361e0b36e17953"
n_rows = 1613
fetch = "python -m vp_nrf2.data fetch-epa --verify"

[model]
family = "xgboost-binary-ensemble"
features = "combo3"
fit = "five assay-token members for nrf2_are, trained with EPA AEID 1110 rows excluded by primary identity and validation scaffold, averaged and guarded-Platt calibrated on the validation carve; one model for nrf2_cytotox, each using a 10% scaffold carve; nrf2_cytotox also trains on the further viability screens, scaffold-blocked against that carve"
weights = "weights.joblib"
sha256 = "4d92fb143bbb8a52a6213a6ca9e965d7f8f2619a15311f82f3a834057a2c8ae0"

[protocol]
id = "scaffold-balanced-5seed@1"
provider = "vp-core"
core_version = "1.4.0"

[provenance]
python = "3.11.11"
rdkit = "2026.03.5"
xgboost = "3.2.0"
